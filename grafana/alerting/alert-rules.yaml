                "maxDataPoints": 43200,
                "rawQuery": true,
                "rawSql": "SELECT company, site, device_id, safe_range_f, excursion_f\nFROM (\n  SELECT DISTINCT ON (t.device_id)\n    d.company,\n    d.site,\n    COALESCE(d.display_name, t.device_id) AS device_id,\n    round((d.temp_min_c * 9.0/5.0 + 32)::numeric, 1) || ' to ' ||\n      round((d.temp_max_c * 9.0/5.0 + 32)::numeric, 1) AS safe_range_f,\n    GREATEST(\n      t.temperature_c - d.temp_max_c,\n      d.temp_min_c - t.temperature_c\n    ) * 9.0/5.0 AS excursion_f\n  FROM telemetry t JOIN devices d ON d.device_id = t.device_id AND d.is_active\n  WHERE t.recorded_at > now() - interval '30 minutes'\n  ORDER BY t.device_id, t.recorded_at DESC\n) latest",
