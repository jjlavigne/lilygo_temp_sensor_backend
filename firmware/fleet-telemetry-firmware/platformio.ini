[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The LILYGO communicates with the computer at this speed
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    ; DS18B20 temperature probe on GPIO 25
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    ; Reachability check against the broker host before connecting
    marian-craciunescu/ESP32Ping @ ^1.7

upload_port = COM5
