[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The LILYGO communicates with the computer at this speed
monitor_speed = 115200

; These are the two libraries we need for MQTT and JSON
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

upload_port = COM5