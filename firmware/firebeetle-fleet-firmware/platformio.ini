; FireBeetle 2 ESP32-E build.
;
; Separate project from fleet-telemetry-firmware because the board, the library
; set and the pin map all differ. Keeping them apart means a change to one can
; never break the other.

[env:dfrobot_firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino

monitor_speed = 115200
; Set this to whatever COM port the FireBeetle enumerates as -- it will NOT be
; COM5 like the LilyGO. Check Device Manager after plugging it in.
; upload_port = COM6

lib_deps =
    knolleary/PubSubClient@^2.8
    ; Pinned to 6.x to match the LilyGO project. StaticJsonDocument is used, which
    ; compiles under both 6 and 7, so this can be bumped later without code changes.
    bblanchon/ArduinoJson@^6.21.3
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    ; Drives the 2.42" SSD1309 OLED. Handles both OLED and character LCDs, so
    ; swapping the display later is a constructor change, not a rewrite.
    olikraus/U8g2@^2.35.19
